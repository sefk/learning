[project]
name = "explainers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "manim>=0.22.0",
    "mutagen>=1.48.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

# kit/ is installed into the environment, so scene files in any video
# directory can `from kit.scene import *`.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kit"]

